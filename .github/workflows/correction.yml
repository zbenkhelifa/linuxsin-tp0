name: Correction TP0

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  correction:
    name: Correction automatique
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: TP0 — Mise en route
        run: bash tp0.sh 2>&1 | tee /tmp/result.log || true

      - name: Sauvegarder les résultats
        if: always()
        run: |
          score=$(grep -oP 'Score TP[0-9]+ : \K[0-9]+ / [0-9]+' /tmp/result.log | tail -1)
          [ -z "$score" ] && score="non commencé"
          {
            echo "# 📊 TP0 — Mise en route"
            echo ""
            echo "> Mis à jour le $(date '+%d/%m/%Y à %H:%M') (UTC)"
            echo ""
            echo "**Score :** $score"
            echo ""
            echo "```"
            cat /tmp/result.log 2>/dev/null || echo "Aucun résultat"
            echo "```"
          } > RESULTATS.md
          git config user.email "github-actions@github.com"
          git config user.name "LinuxSIN Bot"
          git add RESULTATS.md
          git diff --cached --quiet && exit 0
          git commit -m "📊 Résultats mis à jour [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push || true

      - name: Notifier l'enseignant
        if: always()
        run: |
          score=$(grep -oP 'Score TP[0-9]+ : \K[0-9]+ / [0-9]+' /tmp/result.log | tail -1)
          [ -z "$score" ] && score="non commencé"
          curl -s             -H "Title: TP0 — ${{ github.repository_owner }}"             -H "Tags: white_check_mark"             -d "Score : $score — https://github.com/${{ github.repository }}"             https://ntfy.sh/linuxsin-zbenkhelifa || true

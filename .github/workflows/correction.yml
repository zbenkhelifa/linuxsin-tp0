name: Correction TP0

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  correction:
    name: Correction automatique
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: TP0 — Mise en route
        run: bash tp0.sh 2>&1 | tee /tmp/result.log || true

      - name: Sauvegarder les résultats
        if: always()
        run: |
          score=$(grep -oP 'Score TP[0-9]+ : \K[0-9]+ / [0-9]+' /tmp/result.log | tail -1)
          [ -z "$score" ] && score="non commencé"

          # Badge couleur
          if echo "$score" | grep -qP '^\d+ / \d+$'; then
            num=$(echo "$score" | awk '{print $1}')
            den=$(echo "$score" | awk '{print $3}')
            if [ "$num" = "$den" ]; then
              badge_color="brightgreen"
              badge_label="Validé"
            elif [ "$num" -ge $(( den * 7 / 10 )) ]; then
              badge_color="orange"
              badge_label="En%20cours"
            else
              badge_color="red"
              badge_label="À%20revoir"
            fi
            score_url=$(echo "$score" | sed 's/ /%20/g; s|/|%2F|g')
            badge="![Score](https://img.shields.io/badge/0%20${score_url}-${badge_color}?style=flat-square&label=${badge_label})"
          else
            badge="![Score](https://img.shields.io/badge/0-non%20commencé-lightgrey?style=flat-square)"
          fi

          {
            echo "# 📊 TP0 — Mise en route"
            echo ""
            echo "$badge"
            echo ""
            echo "> Mis à jour le $(date '+%d/%m/%Y à %H:%M') (UTC)"
            echo ""
            echo "**Score :** $score"
            echo ""
            echo '```'
            cat /tmp/result.log 2>/dev/null || echo "Aucun résultat"
            echo '```'
          } > RESULTATS.md

          git config user.email "github-actions@github.com"
          git config user.name "LinuxSIN Bot"
          git add RESULTATS.md
          git diff --cached --quiet && exit 0
          git commit -m "📊 Résultats mis à jour [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push || true

      - name: Notifier enseignant et élève
        if: always()
        run: |
          score=$(grep -oP 'Score TP[0-9]+ : \K[0-9]+ / [0-9]+' /tmp/result.log | tail -1)
          [ -z "$score" ] && score="non commencé"
          eleve="${{ github.repository_owner }}"
          repo="${{ github.repository }}"

          # Enseignant
          curl -s \
            -H "Title: TP0 — ${eleve}" \
            -H "Tags: white_check_mark" \
            -d "Score : ${score} — https://github.com/${repo}" \
            https://ntfy.sh/linuxsin-zbenkhelifa || true

          # Élève (son canal personnel)
          curl -s \
            -H "Title: LinuxSIN — TP0 corrigé !" \
            -H "Tags: mortar_board" \
            -d "Ton score : ${score}  |  Consulte RESULTATS.md dans ton repo" \
            "https://ntfy.sh/linuxsin-${eleve}" || true
